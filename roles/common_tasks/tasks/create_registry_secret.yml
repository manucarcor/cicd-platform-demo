---
- name: Create Docker Registry Secret
  kubernetes.core.k8s:
    state: present
    force: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ registry_secret_name | default('docker-registry-secret') }}"
        namespace: "{{ namespace }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{
            {
              "auths": {
                registry: {
                  "username": registry_username,
                  "password": registry_password,
                  "auth": (registry_username + ':' + registry_password) | b64encode
                }
              }
            } | to_json | b64encode
          }}
